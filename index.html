<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Financial Dashboard 25–26</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hud-header">
  <h1>FINANCIAL DASHBOARD 25–26</h1>
</header>

<section class="filters">
  <div class="filter-group">
    <label>Party</label>
    <select id="party"></select>
  </div>

  <div class="filter-group">
    <label>Item</label>
    <select id="item"></select>
  </div>

  <div class="filter-group">
    <label>Lot No</label>
    <select id="lot"></select>
  </div>

  <div class="filter-group">
    <label>Colour</label>
    <select id="colour"></select>
  </div>

  <div class="filter-group">
    <label>Rate</label>
    <select id="rate"></select>
  </div>

  <div class="filter-group search">
    <label>Search</label>
    <input id="search" placeholder="Bill / Party / Item">
  </div>

  <button class="reset-btn" onclick="resetFilters()">Reset</button>
</section>

<section class="table-wrap">
  <table id="table">
    <thead></thead>
    <tbody></tbody>
  </table>
</section>

<script src="app.js"></script>
</body>
</html>
