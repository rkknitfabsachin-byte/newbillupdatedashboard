<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RK Knit Fab – Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>RK KNIT FAB – DATA DASHBOARD</h1>
  <button onclick="toggleTheme()">🌙</button>
</header>

<section class="filters">
  <input id="search" placeholder="Search anything">
  <input type="date" id="fromDate">
  <input type="date" id="toDate">
</section>

<section class="summary">
  <div><span>Total Weight</span><b id="w">0</b></div>
  <div><span>Total Amount</span><b id="a">0</b></div>
  <div><span>Total Rolls</span><b id="r">0</b></div>
</section>

<section id="tableWrap">
  <table id="table">
    <thead></thead>
    <tbody></tbody>
  </table>
</section>

<script src="app.js"></script>
</body>
</html>
