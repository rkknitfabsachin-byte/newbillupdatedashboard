<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RK Knit Fab – Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>RK KNIT FAB</h1>
  <button onclick="toggleTheme()">🌙</button>
</header>

<!-- FILTERS -->
<section class="filters">
  <input id="f_date" type="date" placeholder="Date">
  <input id="f_bill" placeholder="Bill Number">

  <input list="partyList" id="f_party" placeholder="Party">
  <datalist id="partyList"></datalist>

  <input list="itemList" id="f_item" placeholder="Item">
  <datalist id="itemList"></datalist>

  <input list="lotList" id="f_lot" placeholder="Lot No">
  <datalist id="lotList"></datalist>

  <input list="colourList" id="f_colour" placeholder="Colour">
  <datalist id="colourList"></datalist>

  <input id="f_rate" placeholder="Rate">
  <input id="f_location" placeholder="Location">

  <input id="search" placeholder="Global search">
</section>

<!-- SUMMARY -->
<section class="summary">
  <div><span>Weight</span><b id="sumW">0</b></div>
  <div><span>Amount</span><b id="sumA">0</b></div>
  <div><span>Rolls</span><b id="sumR">0</b></div>
</section>

<!-- DATA -->
<section id="dataWrap">
  <!-- Desktop table -->
  <table id="table">
    <thead></thead>
    <tbody></tbody>
  </table>

  <!-- Mobile cards -->
  <div id="cards"></div>
</section>

<script src="app.js"></script>
</body>
</html>
